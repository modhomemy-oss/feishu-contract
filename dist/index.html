<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>采购供货合同生成器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      padding: 20px;
      color: #333;
      background-color: #f8f9fa;
      margin: 0;
    }
    .contract-box {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 35px;
      border: 1px solid #ddd;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    h1 { text-align: center; margin-bottom: 25px; letter-spacing: 2px; font-size: 22px; }
    .meta-info { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; margin-bottom: 20px; }
    th, td { border: 1px solid #333; padding: 10px 8px; text-align: center; font-size: 13px; }
    th { background-color: #f2f2f2; font-weight: bold; }
    .sign-area { display: flex; justify-content: space-between; margin-top: 40px; line-height: 2; font-size: 14px; }
    .btn-print {
      display: block; width: 100%; max-width: 800px; margin: 0 auto 15px auto;
      padding: 10px; background: #007bff; color: #fff; text-align: center;
      border: none; border-radius: 6px; font-size: 15px; cursor: pointer;
    }
    .btn-print:hover { background: #0056b3; }
    .status-hint { 
      text-align: center; font-size: 13px; margin: 0 auto 15px auto; 
      padding: 8px 12px; border-radius: 4px; background: #e9ecef;
      max-width: 800px; word-break: break-all;
    }
    @media print {
      body { background: #fff; padding: 0; }
      .contract-box { border: none; box-shadow: none; padding: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>

  <div class="no-print status-hint" id="status-text">⏳ 正在尝试与飞书多维表格连接...</div>
  <button class="btn-print no-print" onclick="window.print()">🖨️ 导出 PDF / 打印采购合同</button>

  <div class="contract-box">
    <h1>产品采购供货合同</h1>
    
    <div class="meta-info">
      <div><strong>采购单号(PO号)：</strong><span id="po-no">-</span></div>
      <div><strong>采购下单日期：</strong><span id="order-date">-</span></div>
    </div>
    <div class="meta-info">
      <div><strong>供货方（供应商）：</strong><span id="supplier">-</span></div>
      <div><strong>预计工厂交货日期：</strong><span id="delivery-date">-</span></div>
    </div>
    <div class="meta-info">
      <div><strong>目标市场：</strong><span id="market">-</span></div>
      <div><strong>整单总体积(CBM)：</strong><span id="total-cbm">-</span></div>
    </div>

    <table>
      <thead>
        <tr>
          <th>序号</th>
          <th>需求ID</th>
          <th>补货SKU</th>
          <th>SKU中文名</th>
          <th>补货数量</th>
          <th>单项预估体积(CBM)</th>
        </tr>
      </thead>
      <tbody id="sku-tbody">
        <tr>
          <td colspan="6">正在等待选中 PO 单记录...</td>
        </tr>
      </tbody>
    </table>

    <div class="sign-area">
      <div>
        <strong>甲方（买方）：</strong><br>
        授权代表签字：<br>
        盖章日期：
      </div>
      <div>
        <strong>乙方（供货方）：</strong><br>
        授权代表签字：<br>
        盖章日期：
      </div>
    </div>
  </div>

  <script type="module">
    import { bitable } from 'https://esm.sh/@lark-base-open/js-sdk@0.5.1';

    const statusEl = document.getElementById('status-text');

    // 通用单元格格式化解析
    function formatCell(val) {
      if (val === null || val === undefined) return '';
      if (typeof val === 'number') return val;
      if (typeof val === 'string') return val;
      if (Array.isArray(val)) {
        return val.map(item => {
          if (typeof item === 'object' && item !== null) {
            return item.text || item.name || '';
          }
          return item;
        }).filter(Boolean).join(', ');
      }
      if (typeof val === 'object') {
        return val.text || val.name || '';
      }
      return String(val);
    }

    // 日期格式化
    function formatDate(val) {
      if (!val) return '-';
      if (typeof val === 'number') {
        const d = new Date(val);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      }
      return String(val);
    }

    // 提取关联记录 ID 数组的算法
    function parseLinkedRecordIds(linkVal) {
      if (!linkVal) return [];
      if (Array.isArray(linkVal)) {
        return linkVal.map(item => {
          if (typeof item === 'object' && item !== null) {
            return item.record_id || item.recordId || item.id || item.text;
          }
          return item;
        }).filter(Boolean);
      }
      if (typeof linkVal === 'object') {
        if (Array.isArray(linkVal.recordIds)) return linkVal.recordIds;
        if (Array.isArray(linkVal.record_ids)) return linkVal.record_ids;
      }
      return [];
    }

    // 根据选中的 PO 单记录加载数据
    async function loadRecord(tableId, recordId) {
      if (!recordId) {
        statusEl.innerText = "👉 请在多维表格中点击选中一行采购单 (PO) 记录";
        return;
      }

      statusEl.innerText = "⏳ 正在拉取选中采购单及其关联的 SKU 数据...";

      try {
        // 1. 获取主表
        const currentTable = tableId ? await bitable.base.getTableById(tableId) : await bitable.base.getActiveTable();
        const currentFields = await currentTable.getFieldList();
        
        const curFieldMap = {};
        for (const f of currentFields) {
          const name = await f.getName();
          curFieldMap[name.trim()] = f;
        }

        async function getCellText(nameKeywords) {
          for (const key of nameKeywords) {
            if (curFieldMap[key]) {
              try {
                const val = await currentTable.getCellValue(curFieldMap[key].id, recordId);
                const txt = formatCell(val);
                if (txt) return txt;
              } catch(e) {}
            }
          }
          return '-';
        }

        // 2. 渲染主表信息（支持多种常见命名字段模糊匹配）
        document.getElementById('po-no').innerText = await getCellText(['采购单号(PO号）', '采购单号(PO号)', 'PO号', '采购单号']);
        document.getElementById('supplier').innerText = await getCellText(['供应商', '供货方', '供应商名称']);
        document.getElementById('market').innerText = await getCellText(['国家/市场', '目标市场', '国家']);
        document.getElementById('total-cbm').innerText = await getCellText(['整单总体积(CBM)', '总体积', 'CBM']);

        const orderDateVal = await getCellText(['采购下单日期', '下单日期']);
        document.getElementById('order-date').innerText = formatDate(orderDateVal !== '-' ? orderDateVal : '');

        const deliveryDateVal = await getCellText(['预计工厂交货日期', '交货日期', '预计交货期']);
        document.getElementById('delivery-date').innerText = formatDate(deliveryDateVal !== '-' ? deliveryDateVal : '');

        // 3. 寻找关联 SKU 的字段
        let linkField = curFieldMap['包含SKU明细'] || curFieldMap['SKU明细'] || curFieldMap['补货需求明细'] || curFieldMap['明细'];
        
        // 如果没精确匹配到，尝试搜索包含“明细”或“SKU”的关联字段
        if (!linkField) {
          for (const name in curFieldMap) {
            if (name.includes('明细') || name.includes('SKU')) {
              linkField = curFieldMap[name];
              break;
            }
          }
        }

        const tbody = document.getElementById('sku-tbody');
        tbody.innerHTML = '';

        if (!linkField) {
          tbody.innerHTML = '<tr><td colspan="6" style="color:red;">未在当前数据表找到关联 SKU 的字段（如【包含SKU明细】）</td></tr>';
          statusEl.innerText = "⚠️ 请检查表头中是否存在【包含SKU明细】关联字段";
          return;
        }

        // 4. 解析关联字段提取关联的记录 ID 列表
        const linkVal = await currentTable.getCellValue(linkField.id, recordId);
        const recordIds = parseLinkedRecordIds(linkVal);

        if (recordIds.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6">当前选择的 PO 采购单未关联任何 SKU 需求明细</td></tr>';
          statusEl.innerText = "✅ 已加载主单（注：该 PO 单关联明细为空）";
          return;
        }

        // 5. 寻找到被关联的“明细子表”
        const tableList = await bitable.base.getTableList();
        let detailTable = null;

        // 优先匹配包含“补货需求明细”或“明细”的表
        for (const t of tableList) {
          const tName = await t.getName();
          if (tName.includes('补货需求明细') || tName.includes('明细') || tName.includes('SKU')) {
            detailTable = t;
            break;
          }
        }

        if (!detailTable && tableList.length > 1) {
          // 如果名字没对上，兜底选择除当前主表外的另一张表
          detailTable = tableList.find(t => t.id !== currentTable.id);
        }

        if (!detailTable) {
          tbody.innerHTML = '<tr><td colspan="6" style="color:red;">未在当前多维表格中定位到【补货需求明细表】</td></tr>';
          statusEl.innerText = "⚠️ 未能识别明细子表";
          return;
        }

        // 6. 建立明细子表的字段映射
        const detailFields = await detailTable.getFieldList();
        const dFieldMap = {};
        for (const f of detailFields) {
          const name = await f.getName();
          dFieldMap[name.trim()] = f;
        }

        async function getDetailValue(rId, keywords) {
          for (const key of keywords) {
            if (dFieldMap[key]) {
              try {
                const val = await detailTable.getCellValue(dFieldMap[key].id, rId);
                const txt = formatCell(val);
                if (txt) return txt;
              } catch(e) {}
            }
          }
          return '-';
        }

        // 7. 遍历关联的所有明细 ID，逐行拼装表格
        let rowIndex = 1;
        for (const rId of recordIds) {
          const reqId = await getDetailValue(rId, ['需求ID', 'ID']);
          const sku = await getDetailValue(rId, ['补货SKU', 'SKU', '品名']);
          const skuName = await getDetailValue(rId, ['sku中文名', 'SKU中文名', '中文名', '产品名称']);
          const qty = await getDetailValue(rId, ['补货数量', '建议补货数量', '数量']);
          const cbm = await getDetailValue(rId, ['单项预估体积(CBM)', '体积(CBM)', '体积', 'CBM']);

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${rowIndex++}</td>
            <td>${reqId}</td>
            <td><strong>${sku}</strong></td>
            <td>${skuName}</td>
            <td>${qty}</td>
            <td>${cbm}</td>
          `;
          tbody.appendChild(tr);
        }

        statusEl.innerText = `✅ 采购合同生成成功！已调取关联的 ${recordIds.length} 项 SKU 明细`;

      } catch (err) {
        statusEl.innerText = "❌ 读取明细出错: " + err.message;
        console.error(err);
      }
    }

    // 核心初始化逻辑
    async function init() {
      try {
        statusEl.innerText = "🟢 已成功连接飞书！请在多维表格中选中任意一行采购单 (PO)";

        // 1. 尝试初始化获取当前高亮选中的行
        const selection = await bitable.base.getSelection();
        if (selection && selection.recordId) {
          loadRecord(selection.tableId, selection.recordId);
        }

        // 2. 监听用户选中行切换事件
        bitable.base.onSelectionChange(async (event) => {
          const selection = event?.data || await bitable.base.getSelection();
          if (selection && selection.recordId) {
            loadRecord(selection.tableId, selection.recordId);
          }
        });

      } catch (err) {
        statusEl.innerText = "❌ 飞书 SDK 连接异常: " + err.message;
        console.error(err);
      }
    }

    init();
  </script>
</body>
</html>
