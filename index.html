<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>采购供货合同生成器</title>
  <!-- 使用官方稳定的 SDK CDN -->
  <script src="https://unpkg.com/@lark-base-open/js-sdk@0.5.1/dist/index.umd.js"></script>
  <style>
    body {
      font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      padding: 25px;
      color: #333;
      background-color: #f8f9fa;
    }
    .contract-box {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 40px;
      border: 1px solid #ddd;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    h1 { text-align: center; margin-bottom: 25px; letter-spacing: 2px; }
    .meta-info { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; margin-bottom: 20px; }
    th, td { border: 1px solid #333; padding: 10px 8px; text-align: center; font-size: 13px; }
    th { background-color: #f2f2f2; }
    .sign-area { display: flex; justify-content: space-between; margin-top: 50px; line-height: 2; font-size: 14px; }
    .btn-print {
      display: block; width: 100%; max-width: 800px; margin: 0 auto 15px auto;
      padding: 10px; background: #007bff; color: #fff; text-align: center;
      border: none; border-radius: 6px; font-size: 15px; cursor: pointer;
    }
    .btn-print:hover { background: #0056b3; }
    .status-hint { 
      text-align: center; font-size: 13px; margin-bottom: 15px; 
      padding: 8px; border-radius: 4px; background: #e9ecef;
    }
    @media print {
      body { background: #fff; padding: 0; }
      .contract-box { border: none; box-shadow: none; padding: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>

  <div class="no-print status-hint" id="status-text">⏳ 正在初始化飞书多维表格连接...</div>
  <button class="btn-print no-print" onclick="window.print()">🖨️ 导出 PDF / 打印采购合同</button>

  <div class="contract-box">
    <h1>产品采购供货合同</h1>
    
    <div class="meta-info">
      <div><strong>采购单号(PO号)：</strong><span id="po-no">-</span></div>
      <div><strong>采购下单日期：</strong><span id="order-date">-</span></div>
    </div>
    <div class="meta-info">
      <div><strong>供货方（供应商）：</strong><span id="supplier">-</span></div>
      <div><strong>预计工厂交货日期：</strong><span id="delivery-date">-</span></div>
    </div>
    <div class="meta-info">
      <div><strong>目标市场：</strong><span id="market">-</span></div>
      <div><strong>整单总体积(CBM)：</strong><span id="total-cbm">-</span></div>
    </div>

    <table>
      <thead>
        <tr>
          <th>序号</th>
          <th>需求ID</th>
          <th>补货SKU</th>
          <th>SKU中文名</th>
          <th>补货数量</th>
          <th>单项预估体积(CBM)</th>
        </tr>
      </thead>
      <tbody id="sku-tbody">
        <tr>
          <td colspan="6">正在等待选中 PO 单记录...</td>
        </tr>
      </tbody>
    </table>

    <div class="sign-area">
      <div>
        <strong>甲方（买方）：</strong><br>
        授权代表签字：<br>
        盖章日期：
      </div>
      <div>
        <strong>乙方（供货方）：</strong><br>
        授权代表签字：<br>
        盖章日期：
      </div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status-text');

    // 格式化文本
    function formatCell(val) {
      if (val === null || val === undefined) return '';
      if (typeof val === 'number') return val;
      if (typeof val === 'string') return val;
      if (Array.isArray(val)) {
        return val.map(item => {
          if (typeof item === 'object' && item !== null) {
            return item.text || item.name || '';
          }
          return item;
        }).filter(Boolean).join(', ');
      }
      if (typeof val === 'object') {
        return val.text || val.name || '';
      }
      return String(val);
    }

    function formatDate(val) {
      if (!val) return '-';
      if (typeof val === 'number') {
        const d = new Date(val);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      }
      return String(val);
    }

    // 核心渲染逻辑
    async function loadRecord(tableId, recordId, sdk) {
      if (!tableId || !recordId) {
        statusEl.innerText = "👉 请在表格中点击选中一行 PO 记录";
        return;
      }

      statusEl.innerText = "⏳ 正在读取数据...";

      try {
        const currentTable = await sdk.base.getTableById(tableId);
        const currentFields = await currentTable.getFieldList();
        
        const curFieldMap = {};
        for (const f of currentFields) {
          const name = await f.getName();
          curFieldMap[name.trim()] = f;
        }

        async function getCellText(name) {
          const field = curFieldMap[name];
          if (!field) return '-';
          try {
            const cell = await currentTable.getCell(field.id, recordId);
            const val = await cell.getValue();
            return formatCell(val) || '-';
          } catch(e) { return '-'; }
        }

        document.getElementById('po-no').innerText = 
          (await getCellText('采购单号(PO号）') !== '-') ? await getCellText('采购单号(PO号）') : await getCellText('采购单号(PO号)');
        document.getElementById('supplier').innerText = await getCellText('供应商');
        document.getElementById('market').innerText = await getCellText('国家/市场');
        document.getElementById('total-cbm').innerText = await getCellText('整单总体积(CBM)');

        const orderDateF = curFieldMap['采购下单日期'];
        if (orderDateF) {
          try {
            const val = await (await currentTable.getCell(orderDateF.id, recordId)).getValue();
            document.getElementById('order-date').innerText = formatDate(val);
          } catch(e) {}
        }

        const deliveryDateF = curFieldMap['预计工厂交货日期'];
        if (deliveryDateF) {
          try {
            const val = await (await currentTable.getCell(deliveryDateF.id, recordId)).getValue();
            document.getElementById('delivery-date').innerText = formatDate(val);
          } catch(e) {}
        }

        // 读取关联明细
        const linkField = curFieldMap['包含SKU明细'];
        const tbody = document.getElementById('sku-tbody');
        tbody.innerHTML = '';

        if (!linkField) {
          tbody.innerHTML = '<tr><td colspan="6">未在表中找到【包含SKU明细】字段</td></tr>';
          statusEl.innerText = "⚠️ 未找到关联字段【包含SKU明细】";
          return;
        }

        const linkCell = await currentTable.getCell(linkField.id, recordId);
        const linkVal = await linkCell.getValue();

        let recordIds = [];
        if (Array.isArray(linkVal)) {
          recordIds = linkVal.map(item => typeof item === 'object' ? item.record_id || item.recordId || item.id : item).filter(Boolean);
        } else if (linkVal && linkVal.recordIds) {
          recordIds = linkVal.recordIds;
        }

        if (recordIds.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6">该 PO 单尚未关联任何补货需求明细</td></tr>';
          statusEl.innerText = "✅ 加载完成（该单未关联明细）";
          return;
        }

        // 寻找补货明细表
        const tableList = await sdk.base.getTableList();
        let detailTable = null;
        for (const t of tableList) {
          const tName = await t.getName();
          if (tName.includes('补货需求明细') || tName.includes('明细')) {
            detailTable = t;
            break;
          }
        }

        if (!detailTable) {
          tbody.innerHTML = '<tr><td colspan="6">未找到【补货需求明细表】</td></tr>';
          statusEl.innerText = "⚠️ 未定位到明细表";
          return;
        }

        const detailFields = await detailTable.getFieldList();
        const dFieldMap = {};
        for (const f of detailFields) {
          const name = await f.getName();
          dFieldMap[name.trim()] = f;
        }

        let rowIndex = 1;
        for (const rId of recordIds) {
          async function getDetailCell(name) {
            const field = dFieldMap[name];
            if (!field) return '-';
            try {
              const cell = await detailTable.getCell(field.id, rId);
              const val = await cell.getValue();
              return formatCell(val) || '-';
            } catch(e) { return '-'; }
          }

          const reqId = await getDetailCell('需求ID');
          const sku = await getDetailCell('补货SKU');
          const skuName = await getDetailCell('sku中文名');
          const qty = (await getDetailCell('补货数量') !== '-') ? await getDetailCell('补货数量') : await getDetailCell('建议补货数量');
          const cbm = await getDetailCell('单项预估体积(CBM)');

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${rowIndex++}</td>
            <td>${reqId}</td>
            <td><strong>${sku}</strong></td>
            <td>${skuName}</td>
            <td>${qty}</td>
            <td>${cbm}</td>
          `;
          tbody.appendChild(tr);
        }

        statusEl.innerText = `✅ 加载完成：已成功生成 ${recordIds.length} 个 SKU 明细！`;
      } catch (err) {
        statusEl.innerText = "❌ 读取出错: " + err.message;
        console.error(err);
      }
    }

    // 初始化入口
    window.addEventListener('DOMContentLoaded', async () => {
      // 兼容 window.bitable 或全局注入
      const sdk = window.bitable || (window['@lark-base-open/js-sdk'] && window['@lark-base-open/js-sdk'].bitable);

      if (!sdk) {
        statusEl.innerText = "❌ SDK 加载失败，请检查网络或刷新重试";
        return;
      }

      statusEl.innerText = "🟢 已成功连接飞书，请点击表格中的任意 PO 单记录";

      try {
        const selection = await sdk.base.getSelection();
        if (selection && selection.recordId) {
          loadRecord(selection.tableId, selection.recordId, sdk);
        }
      } catch(e) {}

      sdk.base.onSelectionChange(async (event) => {
        const data = event.data || event;
        if (data && data.recordId) {
          loadRecord(data.tableId, data.recordId, sdk);
        }
      });
    });
  </script>
</body>
</html>
